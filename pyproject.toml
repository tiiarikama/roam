[project]
name = "roam"
version = "0.1.0"
description = "A national parks trip planning chatbot powered by RAG"
authors = [
    {name = "tiiarikama",email = "tiiarikama@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "psycopg2-binary (==2.9.9)",
    "pgvector (>=0.2.5,<0.3.0)",
    "openai (>=2.30.0,<3.0.0)",
    "requests (==2.32.3)",
    "fastapi (==0.112.0)",
    "uvicorn (==0.30.6)",
    "streamlit (==1.37.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.53,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
packages = [{include = "roam", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
